name: Build verified installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers after both architecture builds pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            davpanel/go.sum
            davadmin/go.sum
      - name: Verify source and installer regressions
        run: |
          python3 scripts/audit_sources.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n bootstrap.sh install.sh PODMAN_INSTALL.sh scripts/build-release.sh
      - name: Test and audit Go modules
        run: |
          for component in davpanel davadmin; do
            (cd "$component" && go test ./... && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          done
      - name: Build installer
        run: bash scripts/build-release.sh --arch=${{ matrix.arch }}
      - name: Validate native installer
        if: matrix.arch == 'amd64'
        run: bash dist/davpanel-*-linux-amd64.run --preflight
      - uses: actions/upload-artifact@v4
        with:
          name: davpanel-linux-${{ matrix.arch }}
          path: |
            dist/*-linux-${{ matrix.arch }}.run
            dist/*-linux-${{ matrix.arch }}.run.sha256
            dist/*-linux-${{ matrix.arch }}.tar.gz
            dist/*-linux-${{ matrix.arch }}.tar.gz.sha256
  publish:
    if: inputs.publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: davpanel-linux-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < davpanel/version)
          tag="v$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            [[ "$(git rev-parse "$tag^{}")" == "$GITHUB_SHA" ]] || { echo 'Version tag points at different source.' >&2; exit 1; }
          fi
          (cd release-artifacts && sha256sum --check *.sha256)
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "DavPanel $version" --notes 'DavPanel installers for Linux amd64 and arm64. See INSTALL.md, PLATFORMS.md and AUDIT.md for verification and deployment limits.'
          gh release upload "$tag" release-artifacts/*
          gh release edit "$tag" --draft=false
