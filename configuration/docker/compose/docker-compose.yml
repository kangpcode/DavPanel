services:
  # Database for DavPanel users, plans, websites and domains
  davpanel_mysql:
    image: mariadb:11.4
    container_name: davpanel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: panel
      MYSQL_USER: panel
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      - /root/initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
      - /etc/localtime:/etc/localtime:ro
    oom_kill_disable: true
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.3
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS:-1.0}"
          memory: "${MYSQL_RAM:-0.5G}"
          pids: 200

  # DEPRECATED Malware Scanner used from user panel 
  clamav:
    image: clamav/clamav:${CLAMAV_VERSION}
    container_name: clamav
    volumes:
      - /home/:/home/
      - ./clamav-db:/var/lib/clamav
    restart: unless-stopped
    network_mode: ${CLAMAV_DB_AUTOUPDATE} # needed to update db daily
    environment:
      - CLAMD_STARTUP_DELAY=${CLAMD_STARTUP_DELAY}
    deploy:
      resources:
        limits:
          cpus: "${CLAMAV_CPUS:-1.0}"
          memory: "${CLAMAV_RAM:-1.0G}"
          pids: 200

  # to store user sessions and counters
  davpanel_redis:
    image: redis:8.6.2-alpine
    container_name: davpanel_redis
    command: ["redis-server", "--unixsocket", "/tmp/redis/redis.sock", "--unixsocketperm", "770"]
    volumes:
      - ${REDIS_SOCKET}:/tmp/redis
    restart: always
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.4
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.5}"
          memory: "${REDIS_RAM:-0.5G}"
          pids: 100

  # DavPanel UI
  davpanel:
    image: ghcr.io/kangpcode/davpanel:${VERSION}
    environment:
      DAVPANEL_LICENSE_API: ${DAVPANEL_LICENSE_API:-}
      DAVPANEL_PHP_VERSIONS_API: ${DAVPANEL_PHP_VERSIONS_API:-}
    container_name: davpanel
    hostname: davpanel
    depends_on:
      - davpanel_mysql
      - davpanel_redis
      #- clamav
      #- phpmyadmin
    ports:
      - "${PORT}:2083/tcp"
    volumes:
      - /usr/local/davcli:/usr/local/davcli:ro                                         # davcli    
      - /var/log/davpanel/user/:/var/log/davpanel/user/                                # access and login logs 
      - /var/mail/:/var/mail/                                                            # mailboxes and sieve filters
      - /etc/bind:/etc/bind                                                              # dns
      - /home:/home                                                                      # files      
      - /usr/bin/docker:/usr/bin/docker:ro                                               # docker   
      - /root/.docker/:/root/.docker/:ro                                                 # docker contexts
      - /etc/davpanel/:/etc/davpanel/                                                  # settings      
      - /etc/davpanel/modules/:/modules/plugins/:ro                                     # plugins
      - /etc/davpanel/mysql/container_my.cnf:/etc/my.cnf:ro                             # mysql logins
      - /etc/davpanel/davpanel/translations/:/etc/davpanel/davpanel/translations     # locales
      - /root/davpanel_restart_needed:/root/davpanel_restart_needed                    # flag used on davadmin
      - /run/user/:/hostfs/run/user/:rslave                                              # contexts
      - /run/podman/podman.sock:/run/podman/podman.sock:ro                               # reload caddy on waf changes
      - ${REDIS_SOCKET}:/tmp/redis/                                                      # redis cache
      - /var/log/caddy:/var/log/caddy                                                    # waf and domlogs      
      - /etc/localtime:/etc/localtime:ro                                                 # server timezone
      # CSF
      - /lib/modules:/lib/modules:ro      #TODO: test csf blocks
      - /proc:/host/proc:ro               #TODO: test csf blocks
      - /var/lib/csf/:/var/lib/csf/       #TODO: remove ratelimiting and this
    restart: always
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.5
    deploy:
      resources:
        limits:
          cpus: "${DAVPANEL_CPUS:-1.0}"
          memory: "${DAVPANEL_RAM:-1.0G}"
          pids: 1000

  caddy:
    image: ${CADDY_IMAGE}
    container_name: caddy
    cap_add:
      - NET_ADMIN
    working_dir: /etc/caddy/
    volumes:
      - /etc/davpanel/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/davpanel/caddy/:/etc/davpanel/caddy
      - /etc/davpanel/caddy/ssl:/data/caddy/certificates
      - /etc/davpanel/caddy/coraza_rules.conf:/etc/davpanel/caddy/coraza_rules.conf:ro
      - /var/log/caddy/:/var/log/caddy/
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    mem_limit: ${CADDY_RAM}
    cpus: ${CADDY_CPUS}
    oom_kill_disable: true
    network_mode: host

  # DNS
  bind9:
    container_name: davpanel_dns
    image: ubuntu/bind9:${BIND9_VERSION}
    environment:
      - BIND9_USER=root
      - TZ=${BIND_TIMEZONE}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - /etc/bind/:/etc/bind/
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    oom_kill_disable: true
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.2
    deploy:
      resources:
        limits:
          cpus: "${BIND9_CPUS:-0.5}"
          memory: "${BIND9_RAM:-0.5G}"
          pids: 100

  # FTP
  davadmin_ftp:
    container_name: davadmin_ftp
    image: ghcr.io/kangpcode/davpanel-ftp
    restart: always
    ports:
      - "21:21"
      - "${FTP_PORT_RANGE}:21000-21010"
    volumes:
      - /home/:/home/
      - /etc/davpanel/ftp/vsftpd.conf:/etc/vsftpd/vsftpd.conf:ro
      - /etc/davpanel/ftp/start_vsftpd.sh:/bin/start_vsftpd.sh:ro
      - /etc/davpanel/ftp/vsftpd.chroot_list:/etc/vsftpd.chroot_list
      - /etc/davpanel/ftp/all.users:/etc/davpanel/ftp/all.users
      - /etc/davpanel/ftp/users/:/etc/davpanel/ftp/users/
      - /etc/davpanel/caddy/ssl/:/etc/davpanel/caddy/ssl/:ro #ssl
      - /etc/localtime:/etc/localtime:ro
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.6
    deploy:
      resources:
        limits:
          cpus: "${FTP_CPUS:-0.5}"
          memory: "${FTP_RAM:-0.5G}"
          pids: 5000

  # PHPMYADMIN
  phpmyadmin:
    container_name: phpmyadmin
    restart: unless-stopped
    image: phpmyadmin:${PHPMYADMIN_VERSION:-latest}
    volumes:
      - /etc/davpanel/mysql/phpmyadmin/pma.php:/var/www/html/pma.php
      - /etc/davpanel/mysql/phpmyadmin/config.inc.php:/etc/phpmyadmin/config.inc.php:ro
      - /home:/home:ro
    ports:
      - "8888:80"
    networks:
      davpanel_network:
        ipv4_address: 172.20.0.7
    deploy:
      resources:
        limits:
          cpus: "${PHPMYADMIN_CPU:-1.0}"
          memory: "${PHPMYADMIN_RAM:-1.0G}"
          pids: 5000
    environment:
      MAX_EXECUTION_TIME: ${PHPMYADMIN_MAX_EXECUTION_TIME:-600}
      MEMORY_LIMIT: ${PHPMYADMIN_MEMORY_LIMIT:-512M}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-256M}

volumes:
  mysql:
    labels:
      description: "This volume holds the DavPanel UI database."
      purpose: "configuration"

networks:
  davpanel_network:
    driver: bridge
    labels:
      description: "This network allows DavPanel UI to communicate to system containers."
      purpose: "internal"
    ipam:
      config:
        - subnet: 172.20.0.0/24
